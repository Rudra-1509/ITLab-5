services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nexus_game_backend
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - HOST=0.0.0.0
      - NODE_ENV=production
      - CORS_ORIGIN=*
      - JWT_SECRET=super_secret_jwt_key_project5_college_demo_2024
      - JWT_EXPIRES_IN=7d
      - SCORING_PARTICIPATION=5
      - SCORING_WIN=20
      - SCORING_DRAW=10
      - SCORING_LOSS=2
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:5000/api/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: nexus_game_frontend
    ports:
      - "5173:80"
    environment:
      - VITE_API_URL=${VITE_API_URL:-http://localhost:5000/api}
      - VITE_SOCKET_URL=${VITE_SOCKET_URL:-http://localhost:5000}
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
